name: Build GPU candidate
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  metal:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build an artifact without claiming headless hardware qualification
        run: node native/build.mjs --compile-only
      - run: node native/verify-candidate.mjs .aug-build/native/candidate.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-candidate-macos-arm64
          include-hidden-files: true
          path: |
            .aug-build/native/native-macos-arm64.tar.gz
            .aug-build/native/candidate.json
            aug-package.json
          if-no-files-found: error
